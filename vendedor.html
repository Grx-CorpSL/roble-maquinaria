<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F6F4EF">
  <title>Vendedor — ROBLE Maquinaria</title>
  <meta name="description" content="Máquinas anunciadas por un vendedor en ROBLE Maquinaria, con filtros por tipo de máquina, estado, marca y año.">
  <link rel="canonical" href="https://roble-maquinaria.vercel.app/vendedor.html">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://roble-maquinaria.vercel.app/vendedor.html">
  <meta property="og:title" content="Vendedor — ROBLE Maquinaria">
  <meta property="og:description" content="Máquinas anunciadas por un vendedor en ROBLE Maquinaria, con filtros por tipo de máquina, estado, marca y año.">
  <meta property="og:image" content="https://roble-maquinaria.vercel.app/assets/img/fotos/hero.jpg">
  <meta property="og:site_name" content="ROBLE">
  <meta property="og:locale" content="es_ES">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="assets/roble.css">
  <link rel="stylesheet" href="assets/ml.css">
  <link rel="stylesheet" href="assets/ml-visual.css">
  <style>@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }</style>
</head>
<body>
  <main id="main"></main>
  <script src="/api/maquinaria.js"></script>
  <script src="assets/roble.js"></script>
  <script src="assets/ml.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const R = ROBLE, D = ML.D, v = ML.vend(R.qs().get('id')); const c = ML.shell('vendedores', { excluir: v ? v.id : null });
      if (!v) { document.title = 'Vendedor no encontrado — ROBLE Maquinaria'; R.noindex(); c.innerHTML = `<div class="empty">${R.icon('building')}<h1 class="empty-title">Ese vendedor no está en ROBLE</h1><p>Puede que haya retirado su perfil.</p><a class="btn" href="vendedores.html">Ver todos los vendedores</a></div>`; return; }
      const tipos = v.tipos.filter(t => ML.TIPO[t]);
      const todos = ML.anunciosDe(v.id);
      document.title = `Maquinaria de ${v.nombre} — ROBLE Maquinaria`; R.canon('?id=' + v.id);
      document.querySelector('meta[name=description]').content = `${v.nombre}: ${tipos.map(t => ML.TIPO[t].toLowerCase()).join(', ') || 'vendedor'} de maquinaria para la madera${v.region ? ' en ' + v.region : ''}. ${todos.length} máquinas anunciadas en ROBLE.`;
      const f = { cat: '', estado: '', pais: '', marca: '', anio: '' };
      const webUrl = R.webHref(v.web), web = R.webTexto(v.web);
      let mbar = null; const contactar = () => ML.contacto({ empresa_id: v.id, empresa: v.nombre, origen: 'maquinaria', intro: `Escribe a ${v.nombre}. Te responden ellos directamente.`, mensaje: '' });
      function render() {
        const list = todos.filter(a => (!f.cat || a.cat === f.cat) && (!f.estado || a.estado === f.estado) && (!f.pais || a.pais === f.pais) && (!f.marca || R.norm(a.marca).includes(R.norm(f.marca))) && (!f.anio || String(a.anio) === f.anio));
        const cats = [...new Set(todos.map(a => a.cat))].map(ML.cat).filter(Boolean);
        c.innerHTML = `
          <nav class="crumbs" aria-label="Migas"><a href="index.html">Inicio</a>${R.icon('chevron-right', 'sep')}<a href="vendedores.html">Vendedores</a>${R.icon('chevron-right', 'sep')}<span aria-current="page">${R.esc(v.nombre)}</span></nav>
          <header class="vhead emp">${R.tpl.logoTile(v, 'logo-tile-lg')}<div><h1 class="h1">Maquinaria de ${R.esc(v.nombre)}</h1><div class="meta">${tipos.map(t => `<span class="tag">${ML.TIPO[t]}</span>`).join('')}${v.destacado ? '<span class="featured">Destacado</span>' : ''}<span class="label">${R.esc([v.ciudad, v.region].filter(Boolean).join(', ') || 'España')}${v.anio ? ' · desde ' + v.anio : ''}</span></div></div><div class="actions"><button class="btn btn-primary" type="button" id="btn-contact">Contactar</button><a class="btn" href="empresa.html?id=${v.id}">Ficha en el directorio</a>${webUrl ? `<a class="btn btn-ghost" href="${R.esc(webUrl)}" target="_blank" rel="noopener">Web ${R.icon('external', 'i-16')}</a>` : ''}</div></header>
          <div class="section-head" style="margin:4px 0 14px"><h2 class="h3">Máquinas en venta <span class="mono muted small">${todos.length}</span></h2></div>
          ${todos.length > 6 ? `<form class="vfilters" onsubmit="return false"><div class="field"><label for="f-cat">Tipo de máquina</label><select class="select" id="f-cat"><option value="">Cualquiera</option>${cats.map(x => `<option value="${x.id}" ${f.cat === x.id ? 'selected' : ''}>${R.esc(x.nombre)}</option>`).join('')}</select></div><div class="field"><label for="f-estado">Estado</label><select class="select" id="f-estado"><option value="">Cualquiera</option><option value="nueva" ${f.estado === 'nueva' ? 'selected' : ''}>Nueva</option><option value="usada" ${f.estado === 'usada' ? 'selected' : ''}>Segunda mano</option></select></div><div class="field"><label for="f-marca">Marca</label><input class="input" id="f-marca" value="${R.esc(f.marca)}"></div><div class="field"><label for="f-anio">Año</label><input class="input" id="f-anio" type="number" min="1950" max="${new Date().getFullYear()}" value="${R.esc(f.anio)}"></div><button class="btn" type="button" id="apply">Aplicar</button></form>` : ''}
          ${todos.length > 6 ? `<p class="small muted" style="margin-bottom:12px"><b style="color:var(--ink)">${list.length}</b> ${list.length === 1 ? 'máquina' : 'máquinas'}</p>` : ''}
          ${list.length ? `<div class="agrid">${list.map(ML.tpl.acard).join('')}</div>` : `<div class="empty">${R.icon('s-maquinaria')}<p class="empty-title">${todos.length ? 'Nada con esos filtros' : 'Este vendedor aún no ha publicado máquinas'}</p><p>${todos.length ? 'Prueba a quitar un filtro.' : 'Puedes pedirle directamente lo que buscas.'}</p></div>`}

          <div class="vsplit emp" style="margin-top:36px;padding-top:28px;border-top:1px solid var(--border)">
            <div><h2 class="h3" style="margin-bottom:8px">Quién vende</h2><p class="ad-desc">${R.esc(v.desc || 'Este vendedor todavía no ha descrito su actividad.')}</p></div>
            <aside class="plate" aria-label="Datos del vendedor"><div class="plate-head"><span class="label">Vendedor</span></div><div class="plate-body"><dl class="specs">
              ${tipos.length ? `<div class="spec"><dt>Tipo</dt><dd>${tipos.map(t => ML.TIPO[t]).join(', ')}</dd></div>` : ''}
              <div class="spec"><dt>Zona</dt><dd>${R.esc([v.ciudad, v.region].filter(Boolean).join(', ') || 'España')}</dd></div>
              <div class="spec"><dt>País</dt><dd>${ML.pais[v.pais] || R.esc(v.pais || 'España')}</dd></div>
              ${v.anio ? `<div class="spec"><dt>Desde</dt><dd class="mono">${v.anio}</dd></div>` : ''}
              ${webUrl ? `<div class="spec"><dt>Web</dt><dd><a href="${R.esc(webUrl)}" target="_blank" rel="noopener">${R.esc(web)}</a></dd></div>` : ''}
              ${v.telefono ? `<div class="spec"><dt>Teléfono</dt><dd><a href="tel:${R.esc(v.telefono)}">${R.esc(v.telefono)}</a></dd></div>` : ''}
              <div class="spec"><dt>Máquinas</dt><dd class="mono">${todos.length}</dd></div>
            </dl>${v.servicios && v.servicios.length ? `<div class="row" style="gap:6px;margin-top:12px">${v.servicios.map(s => `<span class="tag">${R.esc(s)}</span>`).join('')}</div>` : ''}</div><div class="plate-foot"><span class="label">REF ${String(v.id).padStart(4, '0')} · ${v.destacado ? 'Perfil completo' : 'Perfil básico'}</span></div></aside>
          </div>
`;
        c.querySelector('#btn-contact').addEventListener('click', contactar); if (mbar) mbar.watch(c.querySelector('#btn-contact'));
        const ap = c.querySelector('#apply'); if (ap) ap.addEventListener('click', () => { f.cat = c.querySelector('#f-cat').value; f.estado = c.querySelector('#f-estado').value; f.marca = c.querySelector('#f-marca').value.trim(); f.anio = c.querySelector('#f-anio').value.trim(); render(); });
      }
      render();
      mbar = ML.barraMovil({ label: 'Contactar', onClick: contactar, watch: c.querySelector('#btn-contact') });
    });
  </script>
</body>
</html>
