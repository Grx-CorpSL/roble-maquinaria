<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F6F4EF">
  <base href="../">
  <title>Paquetes — Panel de empresa — ROBLE</title>
  <meta name="description" content="Compra paquetes de anuncios para publicar máquinas en ROBLE.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/archivo-100-900-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/roble.css">
  <link rel="stylesheet" href="assets/ml.css">
  <link rel="stylesheet" href="assets/ml-visual.css">
  <link rel="stylesheet" href="admin/admin.css">
  <style>.admin-header .brand-tag { display: inline-flex; } .packs { margin-bottom: 24px; } @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }</style>
</head>
<body>
  <main id="main" class="admin-main"></main>
  <script src="/api/datos.js?panel=1"></script>
  <script src="/api/maquinaria.js?panel=1"></script>
  <script src="assets/roble.js"></script>
  <script src="assets/ml.js"></script>
  <script src="admin/admin.js"></script>
  <script src="panel/panel.js"></script>
  <script>
    ML.auth.ready.then(() => {
      const R = ROBLE, S = ML.store, D = ML.D, v = Panel.shell('paquetes'); if (!v) return;
      const main = document.getElementById('main');
      function render() {
        main.innerHTML = `
          <div class="page-title"><div><h1>Paquetes de anuncios</h1><p>Pagas por anuncios, no por meses. Los anuncios no caducan hasta que vendes la máquina.</p></div></div>
          <div class="packs">${D.paquetes.map((p, i) => ML.tpl.pack(p, i, v.nombre)).join('')}</div>
          <div class="alert"><svg class="i" aria-hidden="true"><use href="#i-info"/></svg><div><strong>Se pide por WhatsApp o por Gmail.</strong> Pulsa «Pedir» en el paquete y elige cómo escribirnos: el mensaje ya lleva el nombre de tu empresa y te confirmamos por ahí mismo.</div></div>`;
      }
      render();
    });
  </script>
</body>
</html>
